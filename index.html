<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAGB Reference Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>TAGB Reference Hub</h1>
            <div class="mode-tabs">
                <button data-view="flashcards" class="tab active">Flashcards</button>
                <button data-view="quiz" class="tab">Quiz</button>
                <button data-view="belts" class="tab">Belt Colors</button>
                <button data-view="patterns" class="tab">Patterns</button>
                <button data-view="syllabus" class="tab">Syllabus</button>
            </div>
            <div class="controls-top">
                <div class="select-wrapper">
                    <select id="grade-filter">
                        <option value="all">All Grades</option>
                        <option value="10th Kup">10th Kup (White Belt)</option>
                        <option value="9th Kup">9th Kup (Yellow Tag)</option>
                        <option value="8th Kup">8th Kup (Yellow Belt)</option>
                        <option value="7th Kup">7th Kup (Green Tag)</option>
                        <option value="6th Kup">6th Kup (Green Belt)</option>
                        <option value="5th Kup">5th Kup (Blue Tag)</option>
                        <option value="4th Kup">4th Kup (Blue Belt)</option>
                        <option value="3rd Kup">3rd Kup (Red Tag)</option>
                        <option value="2nd Kup">2nd Kup (Red Belt)</option>
                        <option value="1st Kup">1st Kup (Black Tag)</option>
                    </select>
                </div>
                <div class="select-wrapper">
                    <select id="language-mode">
                        <option value="en-ko">English to Korean</option>
                        <option value="ko-en">Korean to English</option>
                    </select>
                </div>
            </div>
        </header>

        <main id="app-content">
            <!-- Router will dynamically mount the active view here -->
        </main>
    </div>
    <script type="module" src="app.js"></script>
</body>

</html>
